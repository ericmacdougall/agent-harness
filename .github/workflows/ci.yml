name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m compileall -q install.py harness tests
      - name: Unit and integration tests
        run: python3 -m unittest discover -s tests -v
      - name: Whitespace
        run: git show --check --oneline HEAD
