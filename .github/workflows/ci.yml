name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Toolchain
        run: python3 --version && git --version
      - name: Python syntax
        run: python3 -m compileall -q install.py harness tests
      - name: Unit and integration tests
        run: python3 -m unittest discover -s tests -v
      - name: Whitespace
        run: git show --check --oneline HEAD
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Format and vet
        shell: bash
        run: test -z "$(gofmt -l .)" && go vet ./...
      - name: Go tests
        run: go test ./...
      - name: CPython goldens are current
        if: runner.os != 'Windows'
        shell: bash
        run: python3 -I internal/pycompat/testdata/gen_golden.py | cmp - internal/pycompat/testdata/golden.json
      - name: Secret-pattern corpus matches harness/hooks
        if: runner.os != 'Windows'
        shell: bash
        run: python3 -I internal/redact/testdata/gen_corpus.py harness/hooks | cmp - internal/redact/testdata/corpus.json
      - name: Reproducible build
        shell: bash
        run: |
          for i in 1 2; do CGO_ENABLED=0 go build -trimpath -buildvcs=false -o "harness-$i" ./cmd/harness; done
          cmp harness-1 harness-2
