name: Codex receipt proof build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-receipt-proof-build
  cancel-in-progress: false

jobs:
  proof:
    if: github.repository == 'ericmacdougall/agent-harness' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out reviewed build source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check out reviewed patch capsule
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ericmacdougall/agent-harness
          ref: 8d688c1c9a548f14de0a1c4b9475ef42e607684b
          path: codex-receipt-capsule
          persist-credentials: false
      - name: Check out pinned OpenAI Codex
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: openai/codex
          ref: d32063f96c2dff1dc96af839b3952abb6acfeda4
          path: codex-upstream
          persist-credentials: false
      - name: Build and verify one Linux binary
        shell: bash
        run: |
          mkdir -m 700 "$RUNNER_TEMP/codex-receipt-home"
          env -i \
            PATH="$HOME/.cargo/bin:/usr/bin:/bin" \
            HOME="$RUNNER_TEMP/codex-receipt-home" \
            CARGO_HOME="$RUNNER_TEMP/codex-receipt-home/.cargo" \
            RUSTUP_HOME="$RUNNER_TEMP/codex-receipt-home/.rustup" \
            LC_ALL=C \
            bash native/codex/build-proof.sh "$RUNNER_TEMP"
      - name: Retain the bounded public proof artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-receipt-linux-x64
          path: ${{ runner.temp }}/codex-receipt-output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
