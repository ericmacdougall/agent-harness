name: Console

on:
  push:
    paths:
      - 'console/**'
      - '.github/workflows/console.yml'
  pull_request:
    paths:
      - 'console/**'
      - '.github/workflows/console.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: harness-console
          - os: macos-latest
            binary: harness-console
          - os: windows-latest
            binary: harness-console.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: false
      - name: Test browser composer
        run: node --test web/composer.test.mjs
      - name: Test
        run: go test ./...
      - name: Race
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      # Unreleased baseline: build to check it compiles; publish no executable.
      - name: Build
        run: go build -trimpath -o dist/${{ matrix.binary }} .
