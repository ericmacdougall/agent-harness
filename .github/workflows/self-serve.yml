name: Self-serve focused tests
# Runs only the self-serve lanes' tests (docs/operations.md, "Agent self-serve"). Dormant while GitHub Actions are off
# for agent-harness, like ci.yml: the enforced gate is the exact-HEAD PR review. No secrets, no network beyond checkout.
on:
  pull_request:
    paths:
      - "harness/hooks/self_serve.py"
      - "harness/hooks/ah_parity.py"
      - "harness/hooks/ah_ops.py"
      - "harness/hooks/ah_install.py"
      - "harness/hooks/guard_files.py"
      - "harness/hooks/supervisor_grant.py"
      - "harness/hooks/supervisor_policy.json"
      - "harness/hooks/ah.py"
      - "harness/hooks/command_guard*.py"
      - "harness/hooks/merge_gate.py"
      - "harness/hooks/peer_review.py"
      - "harness/hooks/usage_guard.py"
      - "harness/hooks/central_decisions.py"
      - "scripts/enable-agent-ops.py"
      - "install.py"
      - "install_codex.py"
      - "docs/operations.md"
      - "docs/self-serve-policy.schema.json"
      - "tests/test_ah_parity.py"
      - "tests/test_self_serve*.py"
      - ".github/workflows/self-serve.yml"
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  self-serve:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.x"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Toolchain
        run: python3 --version && git --version
      - name: Signing dependency (pinned)
        # self_serve.py and enable-agent-ops.py sign and verify the policy with Ed25519 from `cryptography`; the user's Mac
        # /usr/bin/python3 ships 50.0.2, so CI pins the same release and refuses a source build.
        run: python3 -m pip install --disable-pip-version-check --only-binary=:all: "cryptography==50.0.2"
      - name: Syntax of the self-serve modules
        shell: bash
        run: |
          for f in harness/hooks/ah_parity.py harness/hooks/self_serve.py harness/hooks/ah_ops.py; do
            if [ -f "$f" ]; then python3 -m py_compile "$f"; fi
          done
      - name: Parity doctor tests (required)
        run: python3 -m unittest tests.test_ah_parity -v
      - name: Other self-serve lane tests (each pattern that exists)
        shell: bash
        run: |
          ran=0
          for pattern in 'test_self_serve*.py' 'test_ah_ops*.py' 'test_enable_agent_ops*.py' 'test_supervisor_grant*.py' 'test_guard_files*.py'; do
            if ls tests/$pattern >/dev/null 2>&1; then
              python3 -m unittest discover -s tests -p "$pattern" -v
              ran=$((ran+1))
            fi
          done
          echo "patterns run: $ran"
      - name: Whitespace
        run: git show --check --oneline HEAD
