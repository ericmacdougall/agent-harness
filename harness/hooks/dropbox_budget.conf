# Dropbox write budget of the backup account, in write operations per second (goodqa#15218). Every upload to the
# account draws on it: the log backup on each host and the agent bulk uploads (heavy_job_guard's upload lane).
#
# ASSUMPTION: Dropbox does not publish the account limit. The total of 8/s was chosen because throttling
# (too_many_write_operations) appeared at about 7/s on 2026-11-07 (log backup 2/s plus a bulk upload at 5/s).
# Revisit it when a run is throttled with the total under 8/s, or when a host or uploader is added.
#
# Format: one "name value" pair per line, whole numbers 1-99. The shares must add up to at most `account`.
# A reader falls back to its built-in value (log-backup.sh: LOG_BACKUP_TPSLIMIT or 1; heavy_job_guard: 4) when this
# file is missing or invalid, or names no share for it. A share only ever lowers a reader's built-in ceiling.
account 8
log-backup.Mac-2 2
log-backup.t2-dev 1
agent-bulk 4
reserve 1
