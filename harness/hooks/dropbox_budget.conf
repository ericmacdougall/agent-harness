# Dropbox write budget of the backup account, in write operations per second (goodqa#15218). Every upload to the
# account draws on it: the log backup on each host and the agent bulk uploads (heavy_job_guard's upload lane).
#
# ASSUMPTION: Dropbox does not publish the account limit. Throttling (too_many_write_operations) appeared at about
# 7/s on 2026-11-07 (log backup 2/s plus a bulk upload at 5/s), so the total is set below that, at 6/s.
# Revisit it when a run is throttled while every uploader stays inside its share, or when a host or uploader is added.
# Known gap: agent-bulk is enforced per host (one agent upload at a time on each host), not across hosts.
#
# Format: one "name value" line each, a name of letters, digits, dot, dash or underscore, then spaces or tabs, then a
# whole number 1-99; blank lines and lines starting with # are skipped; CRLF line ends are accepted. Names are unique,
# the shares add up to at most `account`, and the file is at most 64 KiB. Anything else makes the whole file invalid.
# Readers: log-backup.sh uses log-backup.<host> as its --tpslimit when LOG_BACKUP_TPSLIMIT is unset (the systemd
# unit) and otherwise only lowers that setting; heavy_job_guard caps the agent upload lane at agent-bulk, never above
# its built-in 4. A missing or invalid file, or one without the reader's share, leaves today's values (1 or the
# LOG_BACKUP_TPSLIMIT setting; 4).
account 6
log-backup.Mac-2 2
log-backup.t2-dev 1
agent-bulk 2
reserve 1
